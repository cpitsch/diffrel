[package]
name = "diffrel"
version = "0.1.0"
edition = "2024"

[dependencies]
disjoint = "0.8.0"
itertools = "0.14.0"
log = "0.4.29"
ndarray = "0.17.2"
process_mining = "0.7.1"
rand = "0.9.2"
rayon = { version = "1.11.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = [ "rayon" ]
rayon = [ "dep:rayon" ]
serde = ["dep:serde", "dep:serde_json"]

[lints.clippy]
redundant_clone = "warn"
doc_markdown = "warn"
perf = "warn"
implicit_clone = "warn"
cast_lossless = "warn"
cast_possible_truncation = "warn"
# cast_precision_loss = "warn"
cast_sign_loss = "warn"
manual_let_else = "warn"
clone_on_copy = "warn"

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"

[profile.release]
debug = true
