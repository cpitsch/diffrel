[package]
name = "diffrel"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.14.0"
log = "0.4.29"
ndarray = "0.17.2"
process_mining = "0.5.2"
rand = "0.9.2"
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = [ "rayon" ]
rayon = [ "dep:rayon" ]

[profile.release]
debug = true
